name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    # Chama o workflow reutilizável com a lógica de testes
    uses: ./.github/workflows/_reusable-test.yml

  notify:
    name: Notify pipeline result
    needs: [test]
    if: always() # Garante que rode mesmo se o job "test" falhar
    runs-on: ubuntu-latest
    steps:
      - name: Compose message
        id: msg
        run: |
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "status=SUCESSO" >> "$GITHUB_OUTPUT"
            echo "color=3066993" >> "$GITHUB_OUTPUT"
          else
            echo "status=FALHA" >> "$GITHUB_OUTPUT"
            echo "color=15158332" >> "$GITHUB_OUTPUT"
          fi
          
      - name: Send webhook
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            -d '{
              "embeds": [{
                "title": "${{ steps.msg.outputs.status }} ${{ github.repository }}",
                "color": ${{ steps.msg.outputs.color }},
                "fields": [
                  {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
                  {"name": "Author", "value": "${{ github.actor }}", "inline": true}
                ],
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }]
            }' \
            "${{ secrets.NOTIFY_WEBHOOK_URL }}"
