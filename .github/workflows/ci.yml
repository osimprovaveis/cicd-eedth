====================================================================
NOME DO WORKFLOW
====================================================================
Define o nome que aparecera na interface do GitHub Actions
Sera usado no badge do README
====================================================================
name: CI

====================================================================
GATILHOS (TRIGGERS)
====================================================================
Define quando o workflow sera executado automaticamente

push:          Roda quando ha commit na branch main
pull_request:  Roda quando um PR e aberto/atualizado para main

Isso implementa o SHIFT-LEFT: problemas sao detectados 
ANTES do merge, nao depois em producao
====================================================================
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

====================================================================
PERMISSOES - PRINCIPIO DO MENOR PRIVILEGIO
====================================================================
Define o nivel de acesso do GITHUB_TOKEN

contents: read -> Apenas LEITURA do codigo

POR QUE E IMPORTANTE:
 Sem isso, o token teria permissoes de escrita por padrao
 Se o workflow for comprometido, um atacante nao pode:
   - Escrever no repositorio
   - Criar releases falsas
   - Modificar configuracoes
   - Apagar codigo
====================================================================
permissions:
  contents: read
  security-events: write  # Descomente se usar upload-sarif do Trivy

====================================================================
DEFINICAO DOS JOBS
====================================================================
jobs:
  
  --------------------------------------------------------------------
  JOB: TEST (PRINCIPAL)
  --------------------------------------------------------------------
  Usa um reusable workflow para executar os testes
  A matrix e definida aqui, a logica esta no reusable
  
  VANTAGENS:
   DRY (Don't Repeat Yourself) - logica em um so lugar
   Facilita manutencao
   Matrix permite testar multiplas versoes em paralelo
  ====================================================================
  test:
    name: Test (Python ${{ matrix.python-version }})
    # Chama o reusable workflow que contem toda a logica de teste
    uses: ./.github/workflows/_reusable-test.yml
    with:
      python-version: ${{ matrix.python-version }}
    strategy:
      matrix:
        # Testa em 3 versoes do Python em paralelo
        # Todas devem passar para o merge ser permitido
        python-version: ['3.10', '3.11', '3.12']

  --------------------------------------------------------------------
  JOB: NOTIFICATIONS
  --------------------------------------------------------------------
  Envia notificacao para Slack/Discord sobre o status do CI
  
  if: always() -> Roda SEMPRE, mesmo se os testes falharem
  
  POR QUE E IMPORTANTE:
   CI roda em background, ninguem fica olhando dashboard
   Falha na main e incidente que precisa de acao rapida
   Notificacao certa no canal certo reduz "quebrou algo?"
  ====================================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: test  # Aguarda o job test finalizar
    if: always() # Roda mesmo se o test falhar
    
    steps:
      ------------------------------------------------------------------
      ENVIA NOTIFICACAO VIA WEBHOOK
      ------------------------------------------------------------------
      O webhook URL esta armazenado como secret no GitHub
      NUNCA coloque a URL diretamente no codigo
      
      FORMATO: Discord (JSON)
      Para Slack, mudar para: 
      {"text": "Pipeline status: ${{ job.status }}"}
      ==================================================================
      - name: Send notification
        env:
          WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠️  NOTIFY_WEBHOOK_URL nao configurado. Pulando notificacao."
            exit 0
          fi
          
          # Define a cor/emoji baseado no status
          if [ "$STATUS" == "success" ]; then
            EMOJI="✅"
            COLOR="65280"  # Verde
          else
            EMOJI="❌"
            COLOR="16711680"  # Vermelho
          fi
          
          # Envia a notificacao (formato Discord)
          curl -X POST -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"$EMOJI Pipeline Status: $STATUS\",
                \"description\": \"**Repositorio:** $REPO\n**Run:** [Ver detalhes]($SERVER/$REPO/actions/runs/$RUN_ID)\n**Branch:** ${GITHUB_REF#refs/heads/}\",
                \"color\": $COLOR,
                \"timestamp\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"
              }]
            }" \
            "$WEBHOOK_URL"
