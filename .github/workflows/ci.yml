name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:        # permite rodar manual pela aba Actions

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/_reusable-test.yml
    # Sem "with": usa o default do reusable ["3.10", "3.11", "3.12"]

  notify:
    name: Notify pipeline result
    needs: [test]
    if: always()            # sem isto, nunca avisaria justamente sobre falha
    runs-on: ubuntu-latest
    steps:
      - name: Compose message
        id: msg
        run: |
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "status=SUCESSO" >> "$GITHUB_OUTPUT"
            echo "color=3066993" >> "$GITHUB_OUTPUT"
          else
            echo "status=FALHA" >> "$GITHUB_OUTPUT"
            echo "color=15158332" >> "$GITHUB_OUTPUT"
          fi

      - name: Send webhook
        env:
          WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "NOTIFY_WEBHOOK_URL nao configurado. Pulando."
            exit 0
          fi
          curl -X POST -H 'Content-Type: application/json' \
            -d '{
              "embeds": [{
                "title": "${{ steps.msg.outputs.status }} — ${{ github.repository }}",
                "color": ${{ steps.msg.outputs.color }},
                "fields": [
                  {"name": "Branch", "value": "${{ github.head_ref || github.ref_name }}", "inline": true},
                  {"name": "Author", "value": "${{ github.actor }}", "inline": true}
                ],
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }]
            }' \
            "$WEBHOOK_URL"