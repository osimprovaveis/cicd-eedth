name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Menor privilégio: todo job herda read. Quem precisar de mais, pede no próprio job.
permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    uses: ./.github/workflows/_reusable-test.yml
    strategy:
      fail-fast: false      # queremos saber se quebrou em 1 ou nas 3, não só na primeira
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    with:
      python-version: ${{ matrix.python-version }}

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: test
    if: always()            # sem isto, nunca avisaria justamente sobre falha
    steps:
      - name: Send notification
        env:
          WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          STATUS: ${{ needs.test.result }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "NOTIFY_WEBHOOK_URL nao configurado. Pulando."
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"; COLOR=3066993
          else
            EMOJI="❌"; COLOR=15158332
          fi
          curl -X POST -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"$EMOJI CI: $STATUS — $REPO\",
                \"description\": \"**Branch:** $BRANCH\n[Ver o run]($RUN_URL)\",
                \"color\": $COLOR
              }]
            }" \
            "$WEBHOOK_URL"