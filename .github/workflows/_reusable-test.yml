# Workflow de apoio: chamado pelo ci.yml, nunca disparado por evento próprio.
name: Reusable Test

on:
  workflow_call:
    inputs:
      python-version:
        description: Versão do Python usada nos testes
        required: true
        type: string

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          # A versão do Python entra na chave: cache de 3.10 não serve para 3.12
          key: ${{ runner.os }}-py${{ inputs.python-version }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-py${{ inputs.python-version }}-pip-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Gate 1: corretude
      - name: Run tests with pytest
        run: pytest -v

      # Gate 2: CVEs nas dependências Python declaradas
      - name: Security audit with pip-audit
        run: pip-audit -r requirements.txt --desc

      # Gate 3: CVEs no código e nas libs do filesystem.
      # exit-code 1 é o que transforma o scan em gate; sem isso ele só informa.
      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true      # CVE sem patch não trava o merge para sempre
          vuln-type: os,library
          severity: MEDIUM,HIGH,CRITICAL