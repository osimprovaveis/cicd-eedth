name: Reusable test

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions to test against
        required: false
        type: string
        default: '["3.10", "3.11", "3.12"]'

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # queremos o quadro completo, não só o primeiro erro
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # requirements-dev.txt começa com "-r requirements.txt", então puxa os dois
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # Gate 1: corretude
      - name: Run pytest
        run: pytest -q

      # Gate 2: CVEs nas dependências Python
      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      # Gate 3: CVEs no filesystem (código + libs).
      # exit-code 1 é o que transforma o scan em gate; sem isso ele só informa.
      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: MEDIUM,HIGH,CRITICAL